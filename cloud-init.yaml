#cloud-config

# Update package list
package_update: true
package_upgrade: true

# Install required packages
packages:
  - curl
  - git
  - build-essential

# Run commands to setup Node.js
runcmd:
  # Install Node.js 20.x (LTS)
  - curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
  - apt-get install -y nodejs
  
  # Verify installations
  - node --version > /home/azureuser/node-version.txt
  - npm --version > /home/azureuser/npm-version.txt
  
  # Create workspace directory
  - mkdir -p /home/azureuser/frontend-project
  - chown -R azureuser:azureuser /home/azureuser/frontend-project
  
  # Set permissions
  - chown -R azureuser:azureuser /home/azureuser
  
  # Create a marker file to show setup is complete
  - echo "Cloud-init setup completed at $(date)" > /home/azureuser/setup-complete.txt

# Final message
final_message: "Cloud-init setup completed. Node.js and npm are installed. Ready for development!"
