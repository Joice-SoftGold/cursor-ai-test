<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind - AI Search Console</title>
    <!-- Load Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #D1D5DB;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9CA3AF;
        }
        .soft-shadow {
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }
        .nav-active {
            background-color: #F3F4F6;
            color: #1F2937;
            font-weight: 600;
        }
        .main-content-bg {
            background: linear-gradient(135deg, #FAFAFA 0%, #FFFFFF 100%);
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .modal-content {
            background: white;
            border-radius: 1rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
        }
        .hidden {
            display: none !important;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-active {
            background-color: #10B981;
        }
        .status-inactive {
            background-color: #EF4444;
        }
        .status-pending {
            background-color: #F59E0B;
        }
    </style>
    <script>
        // Global app ID
        const __app_id = 'documind-app';

        // Current filter state
        let currentUserFilter = 'Admin'; // Can be 'Admin', 'Standard', or 'All'

        // Mock data for groups (used in User Management)
        const mockGroups = [
            { id: 1, name: 'Sales', members: 12, color: 'blue' },
            { id: 2, name: 'Marketing', members: 8, color: 'green' },
            { id: 3, name: 'Engineering', members: 25, color: 'purple' },
            { id: 4, name: 'Finance', members: 6, color: 'yellow' }
        ];

        // Mock data for users
        const mockUsers = [
            { id: 1, name: 'John Doe', email: 'john.doe@company.com', role: 'Admin', status: 'active', groups: ['Sales', 'Engineering'], lastLogin: '2 mins ago' },
            { id: 2, name: 'Jane Smith', email: 'jane.smith@company.com', role: 'Standard', status: 'active', groups: ['Marketing'], lastLogin: '1 hour ago' },
            { id: 3, name: 'Mike Johnson', email: 'mike.j@company.com', role: 'Standard', status: 'inactive', groups: ['Sales'], lastLogin: '3 days ago' },
            { id: 4, name: 'Sarah Williams', email: 's.williams@company.com', role: 'Admin', status: 'active', groups: ['Finance'], lastLogin: '5 mins ago' },
            { id: 5, name: 'Tom Brown', email: 'tom.brown@company.com', role: 'Standard', status: 'pending', groups: ['Engineering'], lastLogin: 'Never' }
        ];

        // Mock audit logs
        const mockAuditLogs = [
            { id: 1, timestamp: '2025-12-11 14:25:00', user: 'John Doe', action: 'Login', details: 'Successful login from IP 192.168.1.10', type: 'security' },
            { id: 2, timestamp: '2025-12-11 14:20:15', user: 'Jane Smith', action: 'Document Upload', details: 'Uploaded "Q4_Report.pdf" (2.3 MB)', type: 'data' },
            { id: 3, timestamp: '2025-12-11 14:18:45', user: 'Mike Johnson', action: 'Search Query', details: 'Searched for "sales projections 2025"', type: 'usage' },
            { id: 4, timestamp: '2025-12-11 14:15:30', user: 'Sarah Williams', action: 'User Management', details: 'Updated permissions for Tom Brown', type: 'admin' },
            { id: 5, timestamp: '2025-12-11 14:10:00', user: 'Tom Brown', action: 'Failed Login', details: 'Failed login attempt from IP 192.168.1.25', type: 'security' },
            { id: 6, timestamp: '2025-12-11 14:05:20', user: 'John Doe', action: 'Integration', details: 'Connected Salesforce data source', type: 'integration' },
            { id: 7, timestamp: '2025-12-11 14:00:10', user: 'Jane Smith', action: 'AI Query', details: 'Used AI assistant for document analysis', type: 'usage' }
        ];

        // Usage data for charts
        const usageData = {
            daily: [45, 52, 38, 67, 89, 92, 78],
            weekly: [320, 410, 380, 450, 490, 520, 480],
            monthly: [1850, 2100, 2350, 2700, 3100, 3400, 3200]
        };

        // Navigate between modules
        function navigateTo(module) {
            // Update nav active state
            document.querySelectorAll('#sidebar nav a').forEach(link => {
                link.classList.remove('nav-active');
                link.classList.add('text-gray-600', 'hover:bg-gray-100');
                link.classList.remove('text-gray-900');
            });
            const activeLink = document.getElementById(`nav-${module}`);
            if (activeLink) {
                activeLink.classList.add('nav-active');
                activeLink.classList.remove('text-gray-600', 'hover:bg-gray-100');
                activeLink.classList.add('text-gray-900');
            }

            // Render the appropriate module
            const container = document.getElementById('main-content-container');
            switch(module) {
                case 'usage':
                    container.innerHTML = renderUsageModule();
                    initializeUsageCharts();
                    break;
                case 'integrations':
                    container.innerHTML = renderIntegrationsModule();
                    break;
                case 'users':
                    container.innerHTML = renderUsersModule();
                    break;
                case 'logs':
                    container.innerHTML = renderLogsModule();
                    break;
                default:
                    container.innerHTML = renderUsageModule();
                    initializeUsageCharts();
            }
            lucide.createIcons();
        }

        // Render AI Usage Tracking Module
        function renderUsageModule() {
            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h1 class="text-3xl font-bold text-gray-900">AI Usage Tracking</h1>
                        <button onclick="openSettings()" class="px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors flex items-center gap-2">
                            <i data-lucide="settings" class="w-4 h-4"></i>
                            Settings
                        </button>
                    </div>

                    <!-- Stats Overview -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div class="bg-white p-6 rounded-xl soft-shadow">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-600">Total Queries</p>
                                    <p class="text-2xl font-bold text-gray-900 mt-1">24,567</p>
                                    <p class="text-xs text-green-600 mt-1">+12% from last week</p>
                                </div>
                                <div class="p-3 bg-blue-50 rounded-lg">
                                    <i data-lucide="search" class="w-6 h-6 text-blue-600"></i>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-xl soft-shadow">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-600">Active Users</p>
                                    <p class="text-2xl font-bold text-gray-900 mt-1">432</p>
                                    <p class="text-xs text-green-600 mt-1">+8% from last week</p>
                                </div>
                                <div class="p-3 bg-green-50 rounded-lg">
                                    <i data-lucide="users" class="w-6 h-6 text-green-600"></i>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-xl soft-shadow">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-600">Avg Response Time</p>
                                    <p class="text-2xl font-bold text-gray-900 mt-1">1.2s</p>
                                    <p class="text-xs text-green-600 mt-1">-15% from last week</p>
                                </div>
                                <div class="p-3 bg-purple-50 rounded-lg">
                                    <i data-lucide="zap" class="w-6 h-6 text-purple-600"></i>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-xl soft-shadow">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-600">Storage Used</p>
                                    <p class="text-2xl font-bold text-gray-900 mt-1">387 GB</p>
                                    <p class="text-xs text-yellow-600 mt-1">78% of limit</p>
                                </div>
                                <div class="p-3 bg-yellow-50 rounded-lg">
                                    <i data-lucide="hard-drive" class="w-6 h-6 text-yellow-600"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Chart Section -->
                    <div class="bg-white p-6 rounded-xl soft-shadow">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-semibold text-gray-900">Query Trends</h2>
                            <div class="flex gap-2">
                                <button onclick="updateChart('daily')" class="px-4 py-2 text-sm bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors">Daily</button>
                                <button onclick="updateChart('weekly')" class="px-4 py-2 text-sm bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">Weekly</button>
                                <button onclick="updateChart('monthly')" class="px-4 py-2 text-sm bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">Monthly</button>
                            </div>
                        </div>
                        <div class="h-64" id="usage-chart">
                            <!-- Chart visualization would go here in a real implementation -->
                            <div class="flex items-end justify-between h-full gap-4 px-4">
                                <div class="w-full bg-gradient-to-t from-blue-500 to-blue-300 rounded-t-lg" style="height: 45%"></div>
                                <div class="w-full bg-gradient-to-t from-blue-500 to-blue-300 rounded-t-lg" style="height: 55%"></div>
                                <div class="w-full bg-gradient-to-t from-blue-500 to-blue-300 rounded-t-lg" style="height: 40%"></div>
                                <div class="w-full bg-gradient-to-t from-blue-500 to-blue-300 rounded-t-lg" style="height: 70%"></div>
                                <div class="w-full bg-gradient-to-t from-blue-500 to-blue-300 rounded-t-lg" style="height: 95%"></div>
                                <div class="w-full bg-gradient-to-t from-blue-500 to-blue-300 rounded-t-lg" style="height: 90%"></div>
                                <div class="w-full bg-gradient-to-t from-blue-500 to-blue-300 rounded-t-lg" style="height: 80%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Data Integrations Module
        function renderIntegrationsModule() {
            const integrations = [
                { name: 'Salesforce', status: 'connected', icon: 'database', color: 'blue', lastSync: '5 mins ago' },
                { name: 'SharePoint', status: 'connected', icon: 'folder', color: 'green', lastSync: '1 hour ago' },
                { name: 'Google Drive', status: 'pending', icon: 'cloud', color: 'yellow', lastSync: 'Never' },
                { name: 'Dropbox', status: 'disconnected', icon: 'hard-drive', color: 'red', lastSync: '2 days ago' }
            ];

            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h1 class="text-3xl font-bold text-gray-900">Data Integrations</h1>
                        <button class="px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors flex items-center gap-2">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            Add Integration
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${integrations.map(int => `
                            <div class="bg-white p-6 rounded-xl soft-shadow">
                                <div class="flex items-center justify-between mb-4">
                                    <div class="flex items-center gap-3">
                                        <div class="p-3 bg-${int.color}-50 rounded-lg">
                                            <i data-lucide="${int.icon}" class="w-6 h-6 text-${int.color}-600"></i>
                                        </div>
                                        <div>
                                            <h3 class="font-semibold text-gray-900">${int.name}</h3>
                                            <p class="text-sm text-gray-600">Last sync: ${int.lastSync}</p>
                                        </div>
                                    </div>
                                    <span class="status-dot status-${int.status === 'connected' ? 'active' : int.status === 'pending' ? 'pending' : 'inactive'}"></span>
                                </div>
                                <div class="flex gap-2">
                                    ${int.status === 'connected' ? `
                                        <button class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors text-sm">Configure</button>
                                        <button class="flex-1 px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-colors text-sm">Disconnect</button>
                                    ` : `
                                        <button class="flex-1 px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors text-sm">Connect</button>
                                    `}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Render User Management Module
        function renderUsersModule() {
            const filteredUsers = currentUserFilter === 'All' ? mockUsers : mockUsers.filter(u => u.role === currentUserFilter);

            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h1 class="text-3xl font-bold text-gray-900">User Management</h1>
                        <div class="flex gap-3">
                            <button onclick="openGroupModal()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors flex items-center gap-2">
                                <i data-lucide="users" class="w-4 h-4"></i>
                                Manage Groups
                            </button>
                            <button onclick="openAddUserModal()" class="px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors flex items-center gap-2">
                                <i data-lucide="user-plus" class="w-4 h-4"></i>
                                Add User
                            </button>
                        </div>
                    </div>

                    <!-- Filter Tabs -->
                    <div class="flex gap-2 border-b border-gray-200">
                        <button onclick="filterUsers('All')" class="px-4 py-2 ${currentUserFilter === 'All' ? 'border-b-2 border-gray-900 font-semibold text-gray-900' : 'text-gray-600 hover:text-gray-900'}">All Users (${mockUsers.length})</button>
                        <button onclick="filterUsers('Admin')" class="px-4 py-2 ${currentUserFilter === 'Admin' ? 'border-b-2 border-gray-900 font-semibold text-gray-900' : 'text-gray-600 hover:text-gray-900'}">Admins (${mockUsers.filter(u => u.role === 'Admin').length})</button>
                        <button onclick="filterUsers('Standard')" class="px-4 py-2 ${currentUserFilter === 'Standard' ? 'border-b-2 border-gray-900 font-semibold text-gray-900' : 'text-gray-600 hover:text-gray-900'}">Standard Users (${mockUsers.filter(u => u.role === 'Standard').length})</button>
                    </div>

                    <!-- Users Table -->
                    <div class="bg-white rounded-xl soft-shadow overflow-hidden">
                        <table class="w-full">
                            <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Groups</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Login</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200">
                                ${filteredUsers.map(user => `
                                    <tr class="hover:bg-gray-50">
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <div class="flex items-center">
                                                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white font-semibold">
                                                    ${user.name.split(' ').map(n => n[0]).join('')}
                                                </div>
                                                <div class="ml-4">
                                                    <div class="text-sm font-medium text-gray-900">${user.name}</div>
                                                    <div class="text-sm text-gray-500">${user.email}</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <span class="px-3 py-1 text-xs font-medium rounded-full ${user.role === 'Admin' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'}">${user.role}</span>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <span class="flex items-center gap-2">
                                                <span class="status-dot status-${user.status}"></span>
                                                <span class="text-sm text-gray-700 capitalize">${user.status}</span>
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <div class="flex gap-1">
                                                ${user.groups.slice(0, 2).map(group => `
                                                    <span class="px-2 py-1 text-xs bg-gray-100 text-gray-700 rounded">${group}</span>
                                                `).join('')}
                                                ${user.groups.length > 2 ? `<span class="px-2 py-1 text-xs bg-gray-100 text-gray-700 rounded">+${user.groups.length - 2}</span>` : ''}
                                            </div>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.lastLogin}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                                            <button onclick="editUser(${user.id})" class="text-blue-600 hover:text-blue-800 mr-3">Edit</button>
                                            <button class="text-red-600 hover:text-red-800">Delete</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // Render Audit Logs Module
        function renderLogsModule() {
            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h1 class="text-3xl font-bold text-gray-900">Audit Logs</h1>
                        <div class="flex gap-3">
                            <select class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-900">
                                <option>All Types</option>
                                <option>Security</option>
                                <option>Data</option>
                                <option>Usage</option>
                                <option>Admin</option>
                                <option>Integration</option>
                            </select>
                            <button class="px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors flex items-center gap-2">
                                <i data-lucide="download" class="w-4 h-4"></i>
                                Export
                            </button>
                        </div>
                    </div>

                    <!-- Logs List -->
                    <div class="bg-white rounded-xl soft-shadow overflow-hidden">
                        <div class="divide-y divide-gray-200">
                            ${mockAuditLogs.map(log => `
                                <div class="p-6 hover:bg-gray-50 transition-colors">
                                    <div class="flex items-start justify-between">
                                        <div class="flex-1">
                                            <div class="flex items-center gap-3 mb-2">
                                                <span class="px-3 py-1 text-xs font-medium rounded-full ${
                                                    log.type === 'security' ? 'bg-red-100 text-red-800' :
                                                    log.type === 'data' ? 'bg-blue-100 text-blue-800' :
                                                    log.type === 'usage' ? 'bg-green-100 text-green-800' :
                                                    log.type === 'admin' ? 'bg-purple-100 text-purple-800' :
                                                    'bg-yellow-100 text-yellow-800'
                                                }">${log.type.toUpperCase()}</span>
                                                <span class="text-sm font-semibold text-gray-900">${log.action}</span>
                                            </div>
                                            <p class="text-sm text-gray-700 mb-2">${log.details}</p>
                                            <div class="flex items-center gap-4 text-xs text-gray-500">
                                                <span class="flex items-center gap-1">
                                                    <i data-lucide="user" class="w-3 h-3"></i>
                                                    ${log.user}
                                                </span>
                                                <span class="flex items-center gap-1">
                                                    <i data-lucide="clock" class="w-3 h-3"></i>
                                                    ${log.timestamp}
                                                </span>
                                            </div>
                                        </div>
                                        <button class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                                            <i data-lucide="more-horizontal" class="w-4 h-4 text-gray-600"></i>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // Filter users by role
        function filterUsers(role) {
            currentUserFilter = role;
            navigateTo('users');
        }

        // Open settings modal
        function openSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        // Close settings modal
        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        // Open storage settings modal
        function openStorageSettings() {
            document.getElementById('storage-settings-modal').classList.remove('hidden');
        }

        // Close storage settings modal
        function closeStorageSettings() {
            document.getElementById('storage-settings-modal').classList.add('hidden');
        }

        // Open edit user modal
        function editUser(userId) {
            const user = mockUsers.find(u => u.id === userId);
            if (user) {
                document.getElementById('edit-user-modal').classList.remove('hidden');
                // In a real app, populate the form with user data
            }
        }

        // Close edit user modal
        function closeEditUser() {
            document.getElementById('edit-user-modal').classList.add('hidden');
        }

        // Open group management modal
        function openGroupModal() {
            document.getElementById('group-modal').classList.remove('hidden');
        }

        // Close group management modal
        function closeGroupModal() {
            document.getElementById('group-modal').classList.add('hidden');
        }

        // Open add user modal
        function openAddUserModal() {
            document.getElementById('add-user-modal').classList.remove('hidden');
        }

        // Close add user modal
        function closeAddUser() {
            document.getElementById('add-user-modal').classList.add('hidden');
        }

        // Update chart data
        function updateChart(period) {
            // In a real implementation, this would update the chart with new data
            console.log(`Updating chart to show ${period} data`);
            // Update button styles
            document.querySelectorAll('#usage-chart').forEach(btn => {
                const buttons = btn.previousElementSibling.querySelectorAll('button');
                buttons.forEach(b => {
                    b.classList.remove('bg-gray-900', 'text-white');
                    b.classList.add('bg-gray-100', 'text-gray-700');
                });
            });
            event.target.classList.remove('bg-gray-100', 'text-gray-700');
            event.target.classList.add('bg-gray-900', 'text-white');
        }

        // Initialize usage charts
        function initializeUsageCharts() {
            // In a real implementation, this would initialize chart libraries like Chart.js
            console.log('Charts initialized');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            navigateTo('usage');
            lucide.createIcons();
        });
    </script>
</head>
<body class="font-sans antialiased text-gray-900 min-h-screen overflow-x-hidden">
    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Settings</h2>
                <button onclick="closeSettings()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <i data-lucide="x" class="w-5 h-5 text-gray-600"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Organization Name</label>
                    <input type="text" value="Acme Corporation" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Default Language</label>
                    <select class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900">
                        <option>English</option>
                        <option>Spanish</option>
                        <option>French</option>
                    </select>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-sm font-medium text-gray-700">Email Notifications</span>
                    <button class="w-12 h-6 bg-gray-900 rounded-full relative">
                        <span class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full"></span>
                    </button>
                </div>
                <div class="pt-4 flex gap-3">
                    <button onclick="closeSettings()" class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">Cancel</button>
                    <button onclick="closeSettings()" class="flex-1 px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Storage Settings Modal -->
    <div id="storage-settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Storage Settings</h2>
                <button onclick="closeStorageSettings()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <i data-lucide="x" class="w-5 h-5 text-gray-600"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <div class="flex justify-between text-sm mb-2">
                        <span class="font-medium text-gray-700">Storage Usage</span>
                        <span class="text-gray-600">387 GB / 500 GB</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div class="bg-gradient-to-r from-blue-500 to-purple-500 h-2 rounded-full" style="width: 78%"></div>
                    </div>
                </div>
                <div class="pt-4">
                    <button onclick="closeStorageSettings()" class="w-full px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors">Upgrade Storage</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div id="edit-user-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Edit User</h2>
                <button onclick="closeEditUser()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <i data-lucide="x" class="w-5 h-5 text-gray-600"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                    <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Role</label>
                    <select class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900">
                        <option>Admin</option>
                        <option>Standard</option>
                    </select>
                </div>
                <div class="pt-4 flex gap-3">
                    <button onclick="closeEditUser()" class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">Cancel</button>
                    <button onclick="closeEditUser()" class="flex-1 px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Group Management Modal -->
    <div id="group-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Manage Groups</h2>
                <button onclick="closeGroupModal()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <i data-lucide="x" class="w-5 h-5 text-gray-600"></i>
                </button>
            </div>
            <div class="space-y-3 mb-6">
                ${mockGroups.map(group => `
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-${group.color}-100 flex items-center justify-center">
                                <i data-lucide="users" class="w-5 h-5 text-${group.color}-600"></i>
                            </div>
                            <div>
                                <p class="font-medium text-gray-900">${group.name}</p>
                                <p class="text-sm text-gray-600">${group.members} members</p>
                            </div>
                        </div>
                        <button class="p-2 hover:bg-gray-200 rounded-lg transition-colors">
                            <i data-lucide="more-horizontal" class="w-4 h-4 text-gray-600"></i>
                        </button>
                    </div>
                `).join('')}
            </div>
            <button class="w-full px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors flex items-center justify-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i>
                Create New Group
            </button>
        </div>
    </div>

    <!-- Add User Modal -->
    <div id="add-user-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Add New User</h2>
                <button onclick="closeAddUser()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <i data-lucide="x" class="w-5 h-5 text-gray-600"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                    <input type="text" placeholder="John Doe" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" placeholder="john.doe@company.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Role</label>
                    <select class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900">
                        <option>Standard User</option>
                        <option>Admin</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Assign to Groups</label>
                    <select multiple class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900">
                        ${mockGroups.map(group => `<option>${group.name}</option>`).join('')}
                    </select>
                </div>
                <div class="pt-4 flex gap-3">
                    <button onclick="closeAddUser()" class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">Cancel</button>
                    <button onclick="closeAddUser()" class="flex-1 px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors">Add User</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Folder Chat Modal (empty, can be removed or populated as needed) -->
    <div id="folder-chat-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Folder Chat</h2>
                <button onclick="document.getElementById('folder-chat-modal').classList.add('hidden')" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <i data-lucide="x" class="w-5 h-5 text-gray-600"></i>
                </button>
            </div>
            <p class="text-gray-600">Folder-specific chat interface would go here.</p>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div id="sidebar" class="bg-white w-20 p-5 flex flex-col justify-between fixed top-0 left-0 h-full soft-shadow transition-all duration-300 z-50 border-r border-gray-100">
            <!-- Logo/Brand -->
            <div>
                <!-- Navigation Links -->
                <nav class="space-y-3">
                    <a href="#" id="nav-usage" onclick="navigateTo('usage'); return false;" class="nav-active relative flex items-center justify-center p-2 rounded-lg text-gray-900 transition-all duration-200 group">
                        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                        <span class="absolute left-full ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">Usage</span>
                    </a>
                    <a href="#" id="nav-integrations" onclick="navigateTo('integrations'); return false;" class="relative flex items-center justify-center p-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-all duration-200 group">
                        <i data-lucide="database" class="w-5 h-5"></i>
                        <span class="absolute left-full ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">Integrations</span>
                    </a>
                    <a href="#" id="nav-users" onclick="navigateTo('users'); return false;" class="relative flex items-center justify-center p-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-all duration-200 group">
                        <i data-lucide="users" class="w-5 h-5"></i>
                        <span class="absolute left-full ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">Users</span>
                    </a>
                    <a href="#" id="nav-logs" onclick="navigateTo('logs'); return false;" class="relative flex items-center justify-center p-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-all duration-200 group">
                        <i data-lucide="file-text" class="w-5 h-5"></i>
                        <span class="absolute left-full ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">Audit Logs</span>
                    </a>
                </nav>
            </div>

            <!-- Logout Button -->
            <div>
                <button onclick="if(confirm('Are you sure you want to sign out?')) { window.location.reload(); }" class="relative flex items-center justify-center p-2 rounded-lg text-gray-400 hover:text-red-600 hover:bg-red-50 transition-all duration-200 group w-full">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    <span class="absolute left-full ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">Sign Out</span>
                </button>
            </div>
        </div>

        <!-- Main Content Area -->
        <main class="flex-1 ml-20 p-6 md:p-10 overflow-y-auto transition-all duration-300 main-content-bg">
            <div id="main-content-container" class="h-full">
                <!-- Content will be dynamically loaded here -->
            </div>
        </main>
    </div>
</body>
</html>
