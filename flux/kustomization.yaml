# Kustomization - tells Flux what to deploy from the GitRepository
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-webapp
  namespace: flux-system
spec:
  interval: 5m                    # How often to reconcile
  path: ./k8s/base                # Path to your Kubernetes manifests
  prune: true                     # Remove resources when deleted from repo
  sourceRef:
    kind: GitRepository
    name: gitops-webapp
  targetNamespace: gitops-webapp
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: gitops-webapp
      namespace: gitops-webapp
  timeout: 3m
