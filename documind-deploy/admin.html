<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind - AI Search Console</title>
    <!-- Load Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background-color: #D1D5DB; border-radius: 4px; }
        ::-webkit-scrollbar-track { background-color: #F3F4F6; }
        
        .nav-active { background-color: #F3F4F6; color: #1F2937; font-weight: 600; }
        .soft-shadow { box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08); }
        body { background-color: #FDFDFD; }
        .main-content-bg { background-color: #F9FAFB; }
        .user-message { background-color: #E0F2F7; border-radius: 12px 12px 0 12px; }
        .ai-response { background-color: #FFFFFF; border-radius: 12px 12px 12px 0; border: 1px solid #F3F4F6; }
        .chat-history-scroll { height: calc(100vh - 280px); }
        .file-item { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 50px; align-items: center; padding: 12px 16px; border-bottom: 1px solid #F3F4F6; }
        .file-item:hover { background-color: #FAFAFA; }
        .file-item.is-folder { cursor: pointer; }
        .file-item.drag-over { border: 2px dashed #34D399; background-color: #F0FAF5; }
        .file-children { padding-left: 10px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 1rem; width: 90%; max-width: 600px; height: 80%; max-height: 700px; display: flex; flex-direction: column; }
        .animate-spin-slow { animation: spin 3s linear infinite; }
    </style>
