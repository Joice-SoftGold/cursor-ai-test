<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind - User Portal</title>
    <!-- Load Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background-color: #D1D5DB; border-radius: 4px; }
        ::-webkit-scrollbar-track { background-color: #F3F4F6; }
        
        .nav-active { background-color: #F3F4F6; color: #1F2937; font-weight: 600; }
        .soft-shadow { box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08); }
        body { background-color: #FDFDFD; }
        .main-content-bg { background-color: #F9FAFB; }
        .user-message { background-color: #E0F2F7; border-radius: 12px 12px 0 12px; }
        .ai-response { background-color: #FFFFFF; border-radius: 12px 12px 12px 0; border: 1px solid #F3F4F6; }
        .chat-history-scroll { height: calc(100vh - 180px); /* Increased height by removing header */ }
        .file-item { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 50px; align-items: center; padding: 12px 16px; border-bottom: 1px solid #F3F4F6; }
        .file-item:hover { background-color: #FAFAFA; }
        .file-item.is-folder { cursor: pointer; }
        .file-item.drag-over { border: 2px dashed #34D399; background-color: #F0FAF5; }
        .file-children { padding-left: 10px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 1rem; width: 90%; max-width: 600px; height: 80%; max-height: 700px; display: flex; flex-direction: column; }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        
        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }

        /* Chart Animations */
        @keyframes growBar { from { width: 0; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <script>
        // Global variables
        const __app_id = 'documind-user-app';
        let currentSearchMode = 'nl-query';

        // --- MOCK DATA ---
        const mockFileStructure = [
            { 
                name: "User uploaded files", 
                type: "folder", 
                date: "Just now", 
                status: "Chat Context", 
                isChatFolder: true,
                children: [
                    { name: "Monthly_Sales_Report.pdf", type: "file", date: "Just now", status: "Analyzed" }
                ]
            },
            { name: "Financial Data", type: "folder", date: "Oct 12, 2025", status: "4 files", children: [
                { name: "Q1_Revenue.xlsx", type: "file", date: "Apr 5, 2025", status: "Indexed" },
                { name: "Q2_Revenue.xlsx", type: "file", date: "Jul 1, 2025", status: "Indexed" },
                { name: "Q3_Revenue.xlsx", type: "file", date: "Oct 2, 2025", status: "Indexed" },
                { name: "Global_Sales_Trends.xlsx", type: "file", date: "Oct 15, 2025", status: "Indexed" },
            ]},
            { name: "Project Reports", type: "folder", date: "Sep 28, 2025", status: "15 files", children: [
                { name: "Market_Expansion_Plan.docx", type: "file", date: "Aug 15, 2025", status: "Indexed" },
                { name: "Competitor_Analysis.pdf", type: "file", date: "Sep 30, 2025", status: "Processing" },
                { name: "Customer_Feedback_Survey.csv", type: "file", date: "Sep 10, 2025", status: "Indexed" },
            ]},
            { name: "Inventory_Log_2025.xlsx", type: "file", date: "Sep 25, 2025", status: "Indexed" },
        ];

        // --- HISTORY DATA ---
        const mockChatHistory = [
            { id: 1, title: "Summary: Sales Report", date: "Today, 10:30 AM", snippet: "Summarize the key findings from the Monthly Sales Report...", type: "Summary" },
            { id: 2, title: "Consolidated Q1-Q3 Report", date: "Yesterday, 4:15 PM", snippet: "Generate a new report combining insights from Q1, Q2, and Q3 revenue files...", type: "Report Gen" },
            { id: 3, title: "Revenue Pie Chart (Jan-Mar)", date: "Oct 24, 2025", snippet: "Create a pie chart showing revenue distribution between Jan 1 and Mar 30...", type: "Chart" },
            { id: 4, title: "Sales Trend Analysis", date: "Oct 20, 2025", snippet: "Show a line chart of sales trends based on the Excel data...", type: "Trend Analysis" },
            { id: 5, title: "High Value Inventory", date: "Oct 15, 2025", snippet: "Build a table of inventory items with value > $5000...", type: "Data Table" },
        ];

        // --- TOAST NOTIFICATION SYSTEM ---
        function showToast(message, type = 'success') {
            let container = document.getElementById('toast-notification-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-notification-container';
                container.className = 'fixed bottom-5 right-5 z-50 flex flex-col space-y-2';
                document.body.appendChild(container);
            }
            
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : 'bg-blue-600';
            const icon = type === 'success' ? 'check-circle' : 'info';
            
            toast.className = `${bgClass} text-white px-4 py-3 rounded-lg shadow-lg flex items-center toast-enter min-w-[300px]`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 mr-3"></i><span class="font-medium text-sm">${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                toast.style.transition = 'all 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function simulateExport(filename, type) {
            showToast(`Generating ${type} file: ${filename}...`, 'info');
            setTimeout(() => {
                showToast(`Download Complete: ${filename}`);
            }, 1500);
        }

        // --- PAGE DEFINITIONS ---
        function navigateTo(pageId) {
            const contentContainer = document.getElementById('main-content-container');
            let htmlContent = '';
            let title = '';
            
            if (pageId === 'search') {
                htmlContent = generateSearchContent();
                title = 'AI Search & Query Console';
            } else if (pageId === 'upload') {
                htmlContent = generateUploadContent();
                title = 'Upload & Queue';
            } else if (pageId === 'history') {
                htmlContent = generateHistoryContent();
                title = 'Session History';
            } else {
                htmlContent = generateSearchContent();
                title = 'AI Search & Query Console';
                pageId = 'search';
            }

            document.title = 'DocuMind - ' + title;
            contentContainer.innerHTML = htmlContent;
            
            document.querySelectorAll('nav a').forEach(link => {
                link.classList.remove('nav-active');
                if (link.id === `nav-${pageId}`) link.classList.add('nav-active');
            });
            lucide.createIcons();
            
            if (pageId === 'upload') {
                const newUploadBtn = document.getElementById('new-upload-btn');
                if (newUploadBtn) newUploadBtn.addEventListener('click', simulateUpload);
                
                // FIX: Ensure createFolder is called with null when clicked from header to default to Root
                const newFolderBtn = document.getElementById('new-folder-btn-header');
                if (newFolderBtn) newFolderBtn.addEventListener('click', () => createFolder(null));
                
                initializeFileTreeLogic(); 
            } else if (pageId === 'search') {
                showSearchMode(currentSearchMode);
            }
        }

        // --- HISTORY MODULE ---
        function generateHistoryContent() {
            // Removed header Logo/User info for vertical space
            return `
                <div class="h-full flex flex-col pt-0">
                    <div class="flex justify-between items-center mb-6 pt-4">
                        <h2 class="text-xl font-medium text-gray-600">Session History</h2>
                        <div class="relative">
                            <input type="text" placeholder="Search history..." class="pl-9 p-2 border border-gray-300 rounded-lg text-sm w-64 focus:ring-emerald-500 focus:border-emerald-500">
                            <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-2.5"></i>
                        </div>
                    </div>
                    
                    <div class="flex-1 bg-white p-6 rounded-2xl soft-shadow border border-gray-100 min-h-0 overflow-y-auto">
                        <div class="space-y-4">
                            ${mockChatHistory.map(session => `
                                <div class="flex items-center justify-between p-4 hover:bg-gray-50 rounded-xl border border-gray-100 transition group cursor-pointer bg-white" onclick="loadHistorySession('${session.title}')">
                                    <div class="flex items-start space-x-4">
                                        <div class="p-3 bg-emerald-50 rounded-lg text-emerald-600 group-hover:bg-emerald-100 transition">
                                            <i data-lucide="message-square" class="w-6 h-6"></i>
                                        </div>
                                        <div>
                                            <h4 class="font-bold text-gray-800">${session.title}</h4>
                                            <p class="text-sm text-gray-500 line-clamp-1 mt-1">${session.snippet}</p>
                                            <div class="flex items-center mt-2 space-x-3">
                                                <span class="text-xs text-gray-400 flex items-center"><i data-lucide="calendar" class="w-3 h-3 mr-1"></i> ${session.date}</span>
                                                <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full border border-gray-200">${session.type}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="flex items-center opacity-0 group-hover:opacity-100 transition">
                                        <button class="p-2 text-gray-400 hover:text-emerald-600 transition" title="Resume Chat"><i data-lucide="arrow-right-circle" class="w-5 h-5"></i></button>
                                        <button class="p-2 text-gray-400 hover:text-red-600 transition" title="Delete" onclick="event.stopPropagation(); showToast('Mock delete successful', 'info')"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function loadHistorySession(title) {
            showToast(`Restoring session: ${title}...`);
            setTimeout(() => {
                navigateTo('search');
            }, 1000);
        }

        // --- SEARCH MODULE ---

        function generateNaturalLanguageChatInterface() {
            return `
            <div class="h-full flex flex-col overflow-hidden relative" id="chat-drop-zone">
                <div id="chat-drag-overlay" class="absolute inset-0 z-50 hidden bg-emerald-50 bg-opacity-90 border-4 border-dashed border-emerald-400 rounded-xl m-4 flex-col items-center justify-center pointer-events-none">
                    <i data-lucide="upload-cloud" class="w-16 h-16 text-emerald-600 mb-4"></i>
                    <p class="text-xl font-bold text-emerald-700">Drop files to add to context</p>
                </div>

                <div class="flex flex-col flex-1 mx-auto w-full max-w-5xl min-h-0 relative z-10">
                    <div id="chat-history" class="flex-1 space-y-6 px-4 py-6 main-content-bg overflow-y-auto chat-history-scroll">
                        <!-- Welcome Message -->
                        <div class="flex justify-start mx-auto w-full max-w-5xl px-4">
                            <div class="ai-response max-w-xl p-5 shadow-lg text-gray-700 relative group">
                                <p class="text-base font-semibold mb-2 flex items-center text-emerald-800">
                                    <i data-lucide="sparkles" class="w-5 h-5 text-emerald-500 mr-2"></i> DocuMind Agent
                                </p>
                                <p class="text-sm leading-relaxed">Hello! Ready to uncover insights? Upload your documents or ask a question to instantly visualize trends, summaries, and reports. Let's get started!</p>
                                <div class="mt-3 pt-3 border-t border-gray-100 flex items-center text-xs text-gray-400 relative">
                                    <button onclick="toggleSourcePopup()" class="flex items-center hover:text-emerald-600 transition-colors focus:outline-none">
                                        <i data-lucide="database" class="w-3 h-3 mr-1"></i> Connected Sources
                                    </button>
                                    <div id="source-popup" class="hidden absolute top-full left-0 mt-2 w-64 bg-white p-4 rounded-xl shadow-xl border border-gray-100 z-50">
                                        <h4 class="font-semibold text-gray-800 mb-2 border-b border-gray-50 pb-2">Active Data Sources</h4>
                                        <ul class="space-y-2">
                                            <li class="flex items-center text-gray-600"><div class="p-1 bg-blue-50 rounded mr-2"><i data-lucide="server" class="w-3 h-3 text-blue-500"></i></div> Corporate Data Lake</li>
                                            <li class="flex items-center text-gray-600"><div class="p-1 bg-yellow-50 rounded mr-2"><i data-lucide="folder" class="w-3 h-3 text-yellow-500"></i></div> Uploaded Files (User)</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Input Area -->
                    <div class="p-4 bg-white border-t border-gray-200 soft-shadow mt-auto z-20">
                        <div class="max-w-4xl mx-auto relative flex items-end">
                            <button onclick="document.getElementById('hidden-chat-file-input').click()" class="mb-3 mr-2 p-2 text-gray-400 hover:text-emerald-600 hover:bg-gray-100 rounded-lg transition" title="Attach File">
                                <i data-lucide="paperclip" class="w-5 h-5"></i>
                            </button>
                            <input type="file" id="hidden-chat-file-input" class="hidden" multiple onchange="handleChatFileUpload(this.files)">
                            <textarea id="nl-query-box" placeholder="Ask about summaries, charts, or reports..." class="w-full p-3 pr-16 border border-gray-300 rounded-xl focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 resize-none h-20 shadow-sm text-sm" onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); submitNLQuery(); }"></textarea>
                            <button onclick="submitNLQuery()" class="absolute right-3 top-3 py-2 px-3 bg-emerald-500 text-white font-semibold rounded-lg hover:bg-emerald-600 transition duration-150 shadow-md">
                                <i data-lucide="send" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>`;
        }
        
        function toggleSourcePopup() {
            const popup = document.getElementById('source-popup');
            if (popup) {
                popup.classList.toggle('hidden');
            }
        }
        
        function setupChatDragAndDrop() {
            const dropZone = document.getElementById('chat-drop-zone');
            const overlay = document.getElementById('chat-drag-overlay');
            if (!dropZone || !overlay) return;
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => { dropZone.addEventListener(eventName, e => {e.preventDefault(); e.stopPropagation()}, false); document.body.addEventListener(eventName, e => {e.preventDefault(); e.stopPropagation()}, false); });
            ['dragenter', 'dragover'].forEach(eventName => dropZone.addEventListener(eventName, () => { overlay.classList.remove('hidden'); overlay.classList.add('flex'); }, false));
            ['dragleave', 'drop'].forEach(eventName => dropZone.addEventListener(eventName, () => { overlay.classList.add('hidden'); overlay.classList.remove('flex'); }, false));
            dropZone.addEventListener('drop', e => handleChatFileUpload(e.dataTransfer.files), false);
        }
        
        function handleChatFileUpload(files) {
            if (!files || files.length === 0) return;
            const chatHistory = document.getElementById('chat-history');
            if (!chatHistory) return;
            Array.from(files).forEach(file => {
                const uploadId = 'upload-' + Math.random().toString(36).substr(2, 9);
                chatHistory.innerHTML += `<div id="${uploadId}" class="flex justify-end mb-4 mx-auto w-full max-w-5xl px-4"><div class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm flex items-center min-w-[200px]"><div class="mr-3"><i data-lucide="file" class="w-8 h-8 text-emerald-500"></i></div><div class="flex-1"><p class="text-sm font-medium text-gray-800 truncate max-w-[150px]">${file.name}</p><p class="text-xs text-gray-500">Uploading...</p><div class="w-full bg-gray-100 rounded-full h-1.5 mt-1"><div class="bg-emerald-500 h-1.5 rounded-full animate-pulse" style="width: 60%"></div></div></div></div></div>`;
                chatHistory.scrollTop = chatHistory.scrollHeight;
                lucide.createIcons();
                setTimeout(() => {
                    const el = document.getElementById(uploadId);
                    if (el) {
                        el.innerHTML = `<div class="bg-emerald-50 border border-emerald-100 rounded-lg p-3 shadow-sm flex items-center min-w-[200px]"><div class="mr-3 bg-emerald-100 p-2 rounded-full"><i data-lucide="check" class="w-4 h-4 text-emerald-600"></i></div><div><p class="text-sm font-medium text-emerald-900">Uploaded to Context</p><p class="text-xs text-emerald-600 truncate max-w-[150px]">${file.name}</p></div></div>`;
                        lucide.createIcons();
                    }
                }, 1500);
            });
        }

        // --- NEW CHAT POPULATION LOGIC (Renders all 5 scenarios) ---
        function renderMockConversation(container) {
            // 1. Summary
            container.innerHTML += getUserMsgHtml("Summarize the key findings from the uploaded Monthly Sales Report.");
            container.innerHTML += getAiMsgHtml(generateFileSummary());

            // 2. Report
            container.innerHTML += getUserMsgHtml("Generate a new report combining insights from the 3 uploaded revenue files.");
            container.innerHTML += getAiMsgHtml(generateConsolidatedReport());

            // 3. Pie Chart
            container.innerHTML += getUserMsgHtml("Create a pie chart showing revenue distribution between Jan 1 and Mar 30.");
            container.innerHTML += getAiMsgHtml(generateDateRangePieChart());

            // 4. Line Chart
            container.innerHTML += getUserMsgHtml("Show a line chart of sales trends based on the Excel data.");
            container.innerHTML += getAiMsgHtml(generateTrendLineChart());

            // 5. Table
            container.innerHTML += getUserMsgHtml("Build a table of inventory items with value > $5000.");
            container.innerHTML += getAiMsgHtml(generateRangeTable());
            
            // Scroll to bottom
            setTimeout(() => { container.scrollTop = container.scrollHeight; }, 100);
        }

        function getUserMsgHtml(text) {
            return `<div class="flex justify-end mb-6 mx-auto w-full max-w-5xl px-4"><div class="user-message max-w-2xl px-5 py-4 text-gray-900 shadow-sm border border-blue-100"><p class="text-sm leading-relaxed">${text}</p></div></div>`;
        }

        function getAiMsgHtml(content) {
             return `<div class="flex justify-start mb-6 mx-auto w-full max-w-5xl px-4">${content}</div>`;
        }

        // --- QUERY HANDLING LOGIC (For new user input) ---
        function submitNLQuery(queryText) {
            const queryBox = document.getElementById('nl-query-box');
            let query = queryText;
            if (!query && queryBox) { query = queryBox.value.trim(); queryBox.value = ''; }
            if (!query) return;
            const chatHistory = document.getElementById('chat-history');
            if (!chatHistory) return;
            
            chatHistory.innerHTML += getUserMsgHtml(query);
            
            // Loading State
            chatHistory.innerHTML += `<div id="ai-loading-bubble" class="flex justify-start mb-6 mx-auto w-full max-w-5xl px-4"><div class="ai-response max-w-md px-4 py-3 text-gray-600 shadow-md"><i data-lucide="loader-2" class="w-4 h-4 text-emerald-500 animate-spin inline mr-2"></i><span class="text-sm italic">Analyzing data...</span></div></div>`;
            chatHistory.scrollTop = chatHistory.scrollHeight;
            lucide.createIcons();
            
            setTimeout(() => {
                const loadingElement = document.getElementById('ai-loading-bubble');
                if (loadingElement) loadingElement.remove();
                
                let content = '';
                const lowerQuery = query.toLowerCase();

                if (lowerQuery.includes('summarize') || lowerQuery.includes('summary')) {
                    content = generateFileSummary();
                } else if (lowerQuery.includes('report') && (lowerQuery.includes('3') || lowerQuery.includes('three') || lowerQuery.includes('files'))) {
                    content = generateConsolidatedReport();
                } else if (lowerQuery.includes('pie') && lowerQuery.includes('date')) {
                    content = generateDateRangePieChart();
                } else if (lowerQuery.includes('line') || lowerQuery.includes('trend')) {
                    content = generateTrendLineChart();
                } else if (lowerQuery.includes('table') && (lowerQuery.includes('range') || lowerQuery.includes('>'))) {
                    content = generateRangeTable();
                } else {
                    content = `<div class="ai-response max-w-4xl w-full p-6 shadow-lg border border-gray-100">
                        <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                            <h2 class="text-lg font-bold text-gray-800">General Answer</h2>
                        </div>
                        <p class="text-gray-700 text-sm leading-relaxed">I can help with that. Try asking to "Summarize uploaded file" or "Show trend line chart from excel".</p>
                        ${generateFeedbackActions()}
                    </div>`;
                }
                
                chatHistory.innerHTML += getAiMsgHtml(content);
                chatHistory.scrollTop = chatHistory.scrollHeight;
                lucide.createIcons();
            }, 1500);
        }

        // --- RESPONSE GENERATORS ---

        function generateFileSummary() {
            const downloadButtons = `
                <button onclick="simulateExport('Summary_Report.docx', 'Word Doc')" class="p-1.5 text-gray-600 hover:text-blue-600 bg-gray-50 hover:bg-blue-50 border border-gray-200 hover:border-blue-200 rounded transition flex items-center text-xs font-semibold px-3" title="Download Word Doc">
                    <i data-lucide="file-text" class="w-3.5 h-3.5 mr-1.5"></i> DOCX
                </button>
                <button class="p-1.5 text-gray-600 hover:text-blue-600 bg-gray-50 hover:bg-blue-50 border border-gray-200 hover:border-blue-200 rounded transition flex items-center text-xs font-semibold px-3" title="Copy to Clipboard">
                    <i data-lucide="copy" class="w-3.5 h-3.5 mr-1.5"></i> Copy
                </button>
            `;

            return `<div class="ai-response max-w-4xl w-full p-6 shadow-lg border border-gray-100">
                <div class="flex justify-between items-center mb-5 border-b border-gray-100 pb-3">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center"><i data-lucide="file-text" class="w-5 h-5 mr-2 text-orange-600"></i> Summary: Monthly_Sales_Report.pdf</h2>
                </div>
                <div class="space-y-4 text-gray-700 text-sm mb-3">
                    <p class="font-medium"><strong>Executive Overview:</strong> October sales exceeded targets by 15%, primarily driven by the enterprise sector.</p>
                    <ul class="list-disc list-inside space-y-2 text-xs bg-gray-50 p-4 rounded-lg border border-gray-200">
                        <li><strong>Top Performer:</strong> Northeast Region ($1.2M revenue).</li>
                        <li><strong>Key Risk:</strong> Supply chain delay mentioned on page 4 (3 week lag).</li>
                        <li><strong>Action Item:</strong> Renew vendor contract by Nov 15th.</li>
                    </ul>
                </div>
                <div class="flex items-center text-xs text-gray-500 bg-gray-50 p-2 rounded border border-gray-100">
                    <i data-lucide="file" class="w-3 h-3 mr-2 text-emerald-600"></i>
                    <span><strong>Source:</strong> Uploaded Context File</span>
                </div>
                ${generateResponseFooter(downloadButtons)}
            </div>`;
        }

        function generateConsolidatedReport() {
            const downloadButtons = `
                <button onclick="simulateExport('Consolidated_Report_2025.docx', 'Word Doc')" class="p-1.5 text-gray-600 hover:text-blue-600 bg-gray-50 hover:bg-blue-50 border border-gray-200 hover:border-blue-200 rounded transition flex items-center text-xs font-semibold px-3" title="Download Word Doc">
                    <i data-lucide="file-text" class="w-3.5 h-3.5 mr-1.5"></i> DOCX
                </button>
            `;

            return `<div class="ai-response max-w-4xl w-full p-6 shadow-lg border border-gray-100">
                <div class="flex justify-between items-center mb-5 border-b border-gray-100 pb-3">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center"><i data-lucide="clipboard-list" class="w-5 h-5 mr-2 text-purple-600"></i> Consolidated Q1-Q3 Performance Report</h2>
                </div>
                <div class="space-y-4 text-gray-700 text-sm">
                    <div class="grid grid-cols-3 gap-4 mb-4">
                        <div class="bg-blue-50 p-3 rounded-lg text-center">
                            <p class="text-xs text-gray-500 uppercase">Q1 Revenue</p>
                            <p class="text-lg font-bold text-blue-700">$2.4M</p>
                            <p class="text-xs text-green-600">↑ 5% YoY</p>
                        </div>
                        <div class="bg-blue-50 p-3 rounded-lg text-center">

            return `<span class="text-sm text-gray-600">${status}</span>`;

        function initializeFileTreeLogic() {
            const container = document.getElementById('file-list-container');
            if (!container) return;
            container.querySelectorAll('.file-item.is-folder').forEach(folderItem => {
                folderItem.addEventListener('click', (e) => {
                    // Prevent toggle if clicking action buttons
                    if (e.target.closest('.chat-folder-btn') || e.target.closest('.add-subfolder-btn')) return;
                    
                    const parentLi = folderItem.closest('li');
                    if (!parentLi) return;
                    const childrenUl = parentLi.querySelector('.file-children');
                    if (childrenUl) { childrenUl.classList.toggle('hidden'); const icon = folderItem.querySelector('.toggle-icon'); if (icon) icon.classList.toggle('rotate-90'); }
                });
            });
            container.addEventListener('dragover', (e) => e.preventDefault());
            container.addEventListener('dragenter', (e) => e.preventDefault());
            container.querySelectorAll('[data-is-folder="true"]').forEach(folderItem => {
                folderItem.addEventListener('dragenter', (e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); });
                folderItem.addEventListener('dragleave', (e) => { setTimeout(() => { const target = document.elementFromPoint(e.clientX, e.clientY); if (target && !target.closest('.file-item.is-folder.drag-over')) e.currentTarget.classList.remove('drag-over'); }, 0); });
                folderItem.addEventListener('dragover', (e) => e.preventDefault());
                folderItem.addEventListener('drop', (e) => {
                    e.preventDefault(); e.currentTarget.classList.remove('drag-over');
                    const folderName = e.currentTarget.dataset.folderName; 
                    const toastContainer = document.getElementById('toast-container');
                    if (toastContainer) { toastContainer.innerHTML = `<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative soft-shadow mb-4" role="alert"><span class="block sm:inline">Mock upload successful! File dropped into <strong>${folderName}</strong>.</span></div>`; setTimeout(() => toastContainer.innerHTML = '', 3000); }
                });
            });
        }

        // NEW Create Folder Logic (Updated for Subfolders)
        function createFolder(preSelectedParentName = null, event = null) {
            if (event) event.stopPropagation();
            
            const modal = document.getElementById('create-folder-modal');
            const select = document.getElementById('new-folder-location');
            const nameInput = document.getElementById('new-folder-name');

                select.innerHTML = '<option value="root">My DocuMind Files (Root)</option>';
                const addOptions = (items, level = 0) => {
                    items.forEach(item => {
                        if (item.type === 'folder') {
                            const indent = '&nbsp;'.repeat(level * 4);
                            select.innerHTML += `<option value="${item.name}">${indent}📂 ${item.name}</option>`;

                                addOptions(item.children, level + 1);
                            }
                        }
                    });
                };
                addOptions(mockFileStructure);

                // IMPORTANT FIX: Check type to ensure it's a string, not an Event object
                if (preSelectedParentName && typeof preSelectedParentName === 'string') {
                    select.value = preSelectedParentName;
                } else {
                    select.value = 'root';
                }
                
                modal.classList.remove('hidden');
            }
        }

        function submitCreateFolder() {
            const nameInput = document.getElementById('new-folder-name');
            const select = document.getElementById('new-folder-location');
            const folderName = nameInput.value.trim();
            const locationName = select.value;

            if (!folderName) {
                showToast("Please enter a folder name", 'info');
                return;
            }

            const newFolder = {
                name: folderName,
                type: "folder",
                date: "Just now",
                status: "0 files",
                children: []
            };

            if (locationName === 'root') {
                mockFileStructure.push(newFolder);
            } else {
                // Find parent and add
                const findAndAdd = (items) => {
                    for (let item of items) {
                        if (item.type === 'folder') {
                            if (item.name === locationName) {
                                if (!item.children) item.children = [];
                                item.children.unshift(newFolder); // Add to top of children
                                return true;
                            }
                            if (item.children && findAndAdd(item.children)) return true;
                        }
                    }
                    return false;
                };
                findAndAdd(mockFileStructure);
            }

            // Refresh UI
            const listContainer = document.getElementById('file-list-container');
            if (listContainer) {
               listContainer.innerHTML = `<div class="file-tree"><div class="file-item bg-gray-50 text-xs font-medium text-gray-500 uppercase tracking-wider sticky top-0 z-10"><div>Name</div><div>Type/Size</div><div>Last Modified</div><div>Extraction Status</div><div>Actions</div></div>${generateFileTreeHtml(mockFileStructure)}</div>`;
               initializeFileTreeLogic(); // Re-bind events
               lucide.createIcons();
            }

            closeCreateFolderModal();
            showToast(`Folder "${folderName}" created in ${locationName === 'root' ? 'Root' : locationName}!`);
        }

er" class="p-2 text-blue-500 hover:bg-gray-100 rounded-lg transition duration-150" title="Create New Folder"><i data-lucide="folder-plus" class="w-5 h-5"></i></button><input type="text" placeholder="Search files..." class="p-2 border border-gray-300 rounded-lg text-sm w-48 focus:ring-emerald-500 focus:border-emerald-500"><button class="p-2 text-gray-600 hover:bg-gray-100 rounded-lg" title="View Options"><i data-lucide="layout-grid" class="w-5 h-5"></i></button></div></div><div class="flex-1 min-h-0 overflow-y-auto" id="file-list-container"><div class="file-tree"><div class="file-item bg-gray-50 text-xs font-medium text-gray-500 uppercase tracking-wider sticky top-0 z-10"><div>Name</div><div>Type/Size</div><div>Last Modified</div><div>Extraction Status</div><div>Actions</div></div>${generateFileTreeHtml(mockFileStructure)}</div></div></div></div></div>`;
        }

        // --- FOLDER CHAT FUNCTIONS (Newly Added) ---
        function openFolderChat(folderName, event) {
            if (event) event.stopPropagation();
            const modal = document.getElementById('folder-chat-modal');
            const title = document.getElementById('folder-chat-title');
            const body = document.getElementById('folder-chat-body');
            
            if (modal && title && body) {
                title.innerHTML = `Chat with <span class="text-emerald-600 ml-1">${folderName}</span>`;
                // Clear previous chat
                body.innerHTML = `
                    <div class="flex justify-start">
                        <div class="bg-gray-100 rounded-lg rounded-tl-none p-3 max-w-[80%] text-sm text-gray-700">
                            Hello! I've analyzed the files in <strong>${folderName}</strong>. What would you like to know?
                        </div>
                    </div>`;
                modal.classList.remove('hidden');
                
                // Reset input
                const input = document.getElementById('folder-chat-input');
                if (input) input.value = '';
            }
        }

        function closeFolderChat() {
            const modal = document.getElementById('folder-chat-modal');
            if (modal) modal.classList.add('hidden');
        }

        window.onload = () => {
            lucide.createIcons();
            // Restricted nav event listeners
            ['search', 'upload', 'history'].forEach(id => {
                const el = document.getElementById('nav-' + id);
                if (el) el.addEventListener('click', (e) => { e.preventDefault(); navigateTo(id); });
            });
            navigateTo('search');

            // Setup Folder Chat Listeners
            const sendBtn = document.getElementById('folder-chat-send');
            const input = document.getElementById('folder-chat-input');
            const body = document.getElementById('folder-chat-body');

            if (sendBtn && input && body) {
                const sendMsg = () => {
                    const txt = input.value.trim();
                    if (!txt) return;
                    
                    // User Msg
                    body.innerHTML += `
                        <div class="flex justify-end mt-4">
                            <div class="bg-emerald-100 text-emerald-900 rounded-lg rounded-tr-none p-3 max-w-[80%] text-sm">
                                ${txt}
                            </div>
                        </div>`;
                    input.value = '';
                    body.scrollTop = body.scrollHeight;

                    // Fake AI Response
                    setTimeout(() => {
                        body.innerHTML += `
                            <div class="flex justify-start mt-4">
                                <div class="bg-gray-100 rounded-lg rounded-tl-none p-3 max-w-[80%] text-sm text-gray-700">
                                    <i data-lucide="sparkles" class="w-3 h-3 inline mr-1 text-emerald-500"></i>
                                    Here is a summary based on the documents in this folder... (Mock Response)
                                </div>
                            </div>`;
                        body.scrollTop = body.scrollHeight;
                        lucide.createIcons();
                    }, 1000);
                };

                sendBtn.addEventListener('click', sendMsg);
                input.addEventListener('keydown', (e) => { 
                    if(e.key === 'Enter' && !e.shiftKey) { 
                        e.preventDefault(); 
                        sendMsg(); 
                    } 
                });
            }
        };
    </script>
</head>
