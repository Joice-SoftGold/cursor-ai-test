apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-webapp
  namespace: gitops-webapp
  labels:
    app.kubernetes.io/name: gitops-webapp
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gitops-webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitops-webapp
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: webapp
          # This image tag will be automatically updated by GitHub Actions
          image: YOUR_ACR_NAME.azurecr.io/gitops-webapp:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: acr-secret
