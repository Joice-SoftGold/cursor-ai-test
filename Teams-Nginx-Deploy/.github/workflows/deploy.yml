name: Deploy Nginx to AKS

on:
  repository_dispatch:
    types: [deploy-trigger]
  workflow_dispatch:

jobs:
  deploy:
    name: 'Deploy Nginx Application'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: 'softgold-newresource-group'
          cluster-name: 'Infra-AKSnew'

      - name: Deploy to AKS
        run: |
          kubectl apply -f deployment.yaml

      # 📢 NOTIFICATION STEP
      - name: Send Notification to Teams
        if: always()
        run: |
          MESSAGE="Nginx application deployment finished with status: ${{ job.status }}. View Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"text\": \"$MESSAGE\"}" \
          "${{ secrets.TEAMS_NOTIFY_URL }}"
